<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EventLoop · статистика</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 32px 24px 48px;
    background: #0f0d1c;
    color: #f4f1ff;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  .wrap { max-width: 960px; margin: 0 auto; }
  h1 { margin: 0; font-size: 28px; font-weight: 800; letter-spacing: -.01em; }
  h2 { margin: 0 0 16px; font-size: 15px; font-weight: 700; color: #cbb8fb; text-transform: uppercase; letter-spacing: .06em; }
  .status { margin: 6px 0 28px; font-size: 13px; color: #8f87b3; }
  .status--off { color: #ff8a8a; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 16px; margin-bottom: 16px; }
  .panel { background: #1a1730; border-radius: 18px; padding: 22px 24px; margin-bottom: 16px; }
  .grid .panel { margin-bottom: 0; }
  .big { font-size: 56px; font-weight: 800; line-height: 1; color: #fff; }
  .big small { font-size: 20px; color: #cbb8fb; font-weight: 600; }
  .sub { margin-top: 8px; font-size: 14px; color: #8f87b3; }
  .step { display: grid; grid-template-columns: 220px 1fr 80px 70px; align-items: center; gap: 14px; margin-bottom: 12px; }
  .step__name { font-size: 15px; }
  .step__count { font-size: 22px; font-weight: 800; text-align: right; }
  .step__pct { font-size: 14px; color: #cbb8fb; text-align: right; }
  .track { height: 14px; background: #2a2547; border-radius: 7px; overflow: hidden; }
  .fill { height: 100%; background: #6c4bf0; border-radius: 7px; transition: width .4s ease; }
  .overall { margin-top: 18px; font-size: 16px; }
  .overall b { font-size: 24px; color: #cbb8fb; }
  .cat { display: grid; grid-template-columns: 120px 1fr 40px; align-items: center; gap: 12px; margin-bottom: 10px; font-size: 15px; }
  .cat__n { text-align: right; font-weight: 700; }
  .row { display: grid; grid-template-columns: 80px 170px 1fr 80px; gap: 12px; padding: 8px 0; border-bottom: 1px solid #2a2547; font-size: 14px; }
  .row:last-child { border-bottom: 0; }
  .row--view { color: #6f6894; }
  .row__time { font-variant-numeric: tabular-nums; }
  .row__price { text-align: right; }
  .row__act { font-weight: 700; }
  .row--view .row__act { font-weight: 400; }
  .empty { color: #8f87b3; font-size: 15px; }
  @media (max-width: 640px) {
    .step { grid-template-columns: 1fr 60px 60px; }
    .step .track { grid-column: 1 / -1; grid-row: 2; }
    .row { grid-template-columns: 70px 1fr 70px; }
    .row__title { grid-column: 1 / -1; }
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>EventLoop · статистика</h1>
  <p class="status" id="status">загрузка…</p>

  <div class="grid">
    <section class="panel">
      <h2>Пользователей</h2>
      <div class="big" id="users">0</div>
      <p class="sub">открыли мини-приложение в MAX и что-то сделали</p>
    </section>
    <section class="panel">
      <h2>₽ доведено до покупки</h2>
      <div class="big" id="rub">0</div>
      <p class="sub" id="tickets">билетов: 0</p>
    </section>
  </div>

  <section class="panel">
    <h2>Воронка</h2>
    <div id="funnel"></div>
    <p class="overall">Сквозная конверсия: <b id="overall">0 %</b></p>
  </section>

  <section class="panel">
    <h2>Лайки по категориям</h2>
    <div id="cats"></div>
  </section>

  <section class="panel">
    <h2>Последние действия</h2>
    <div id="recent"></div>
  </section>
</div>

<!-- Названия событий берутся из той же ленты, что у мини-приложения:
     сервер хранит только eventId. -->
<script src="app/data.js"></script>
<script>
(function () {
  'use strict';

  var STEPS = {
    VIEW: 'Увидели карточку',
    LIKE: 'Отметили «Пойду»',
    CLICK_BUY: 'Перешли к покупке',
    PURCHASE_YES: 'Подтвердили покупку'
  };
  var CATS = { THEATRE: 'Театр', CINEMA: 'Кино', MUSEUM: 'Выставка', CONCERT: 'Концерт', EXCURSION: 'Экскурсия' };
  var ACTIONS = {
    VIEW: 'смотрит карточку', LIKE: '«Пойду»', SAVE: 'отложил', DISLIKE: 'не нравится',
    UNDO: 'отменил оценку', CLICK_BUY: 'ушёл покупать', PURCHASE_YES: 'купил',
    PURCHASE_NO: 'ещё не купил', PURCHASE_CANCEL: 'отменил покупку'
  };

  // Карта eventId -> название. data.js может не подгрузиться — тогда номера.
  var TITLES = {};
  try {
    MOCK_EVENTS.forEach(function (e) { TITLES[e.eventId] = e.title; });
  } catch (e) { /* без ленты обойдёмся номерами */ }

  var time = new Intl.DateTimeFormat('ru-RU', {
    hour: '2-digit', minute: '2-digit', second: '2-digit', timeZone: 'Europe/Moscow'
  });

  // Вся разметка — узлами: значения в журнал пишет клиент, склейка строк
  // в HTML была бы дырой.
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) { n.className = cls; }
    if (text !== undefined && text !== null) { n.textContent = String(text); }
    return n;
  }

  function bar(part, whole) {
    var track = el('div', 'track');
    var fill = el('div', 'fill');
    fill.style.width = (whole > 0 ? Math.min(100, part / whole * 100) : 0) + '%';
    track.appendChild(fill);
    return track;
  }

  function pct(x) { return String(x).replace('.', ',') + ' %'; }

  function render(s) {
    document.getElementById('users').textContent = String(s.users);
    document.getElementById('rub').textContent = Number(s.boughtRub).toLocaleString('ru-RU') + ' ₽';
    document.getElementById('tickets').textContent = 'билетов: ' + s.boughtCount;
    document.getElementById('overall').textContent = pct(s.overallPercent);

    var funnel = document.getElementById('funnel');
    funnel.replaceChildren();
    var first = s.funnel.length ? s.funnel[0].count : 0;
    s.funnel.forEach(function (f) {
      var row = el('div', 'step');
      row.appendChild(el('span', 'step__name', STEPS[f.step] || f.step));
      row.appendChild(bar(f.count, first));
      row.appendChild(el('span', 'step__count', f.count));
      row.appendChild(el('span', 'step__pct', pct(f.percentOfPrevious)));
      funnel.appendChild(row);
    });

    var cats = document.getElementById('cats');
    cats.replaceChildren();
    if (!s.likesByCategory.length) {
      cats.appendChild(el('p', 'empty', 'Лайков пока нет.'));
    }
    var max = s.likesByCategory.reduce(function (m, c) { return Math.max(m, c.count); }, 0);
    s.likesByCategory.forEach(function (c) {
      var row = el('div', 'cat');
      row.appendChild(el('span', null, CATS[c.category] || 'Событие'));
      row.appendChild(bar(c.count, max));
      row.appendChild(el('span', 'cat__n', c.count));
      cats.appendChild(row);
    });

    var recent = document.getElementById('recent');
    recent.replaceChildren();
    if (!s.recent.length) {
      recent.appendChild(el('p', 'empty', 'Действий пока нет — открой мини-приложение в MAX.'));
    }
    s.recent.forEach(function (a) {
      // Просмотры приглушены, чтобы покупки читались сразу.
      var row = el('div', 'row' + (a.action === 'VIEW' ? ' row--view' : ''));
      row.appendChild(el('span', 'row__time', time.format(new Date(a.at))));
      row.appendChild(el('span', 'row__act', ACTIONS[a.action] || a.action));
      row.appendChild(el('span', 'row__title', TITLES[a.eventId] || 'Событие #' + a.eventId));
      row.appendChild(el('span', 'row__price', Number(a.priceRub).toLocaleString('ru-RU') + ' ₽'));
      recent.appendChild(row);
    });
  }

  function status(text, off) {
    var s = document.getElementById('status');
    s.textContent = text;
    s.className = 'status' + (off ? ' status--off' : '');
  }

  // Цепочка setTimeout, а не setInterval: медленный ответ не накладывается
  // на следующий запрос. При ошибке на экране остаются последние данные.
  function poll() {
    fetch('/api/stats', { cache: 'no-store' })
      .then(function (r) {
        if (!r.ok) { throw new Error('HTTP ' + r.status); }
        return r.json();
      })
      .then(function (s) {
        render(s);
        status('обновлено ' + time.format(new Date()), false);
      })
      .catch(function () { status('нет связи с сервером', true); })
      .then(function () { setTimeout(poll, 3000); });
  }

  poll();
})();
</script>
</body>
</html>
